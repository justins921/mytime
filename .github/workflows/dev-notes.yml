name: Implement Dev Notes

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement:
    if: contains(github.event.issue.labels.*.name, 'dev-note')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "claude-dev-notes[bot]"
          git config user.email "claude-dev-notes[bot]@users.noreply.github.com"

      - name: Create branch
        run: |
          BRANCH="dev-note/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Write prompt file
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const prompt = [
              `You are working on the MyTime codebase — a Next.js 14 time-tracking & workday management app.`,
              `The project owner submitted this change request via a dev note in the app.`,
              ``,
              `## Title`,
              issue.title,
              ``,
              `## Details`,
              issue.body,
              ``,
              `## Instructions`,
              `- Read the relevant files before making changes`,
              `- Keep changes focused and minimal — only do what was asked`,
              `- Do NOT run git commands — just edit the files`,
              `- Do NOT create new files unless absolutely necessary`,
              `- Do NOT add tests or documentation unless requested`,
            ].join('\n');
            require('fs').writeFileSync('/tmp/dev-note-prompt.txt', prompt);

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "$(cat /tmp/dev-note-prompt.txt)"

      - name: Commit changes
        id: commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes were made."
          else
            git commit -m "Implement dev note #${{ github.event.issue.number }}"
            git push -u origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Dev note: ${{ github.event.issue.title }}" \
            --body "$(cat <<'EOF'
          ## Summary
          Auto-implemented by Claude Code from dev note #${{ github.event.issue.number }}.

          Please review the changes before merging.

          Closes #${{ github.event.issue.number }}
          EOF
          )"

          gh issue comment "${{ github.event.issue.number }}" \
            --body "A PR has been created automatically. Please review the changes."

      - name: Comment if no changes
        if: steps.commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "Claude Code reviewed the request but didn't make any file changes. You may need to provide more detail or implement this manually."
